<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D电磁场粒子动力学仿真引擎</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <nav class="lab-links" aria-label="站点导航">
        <a class="lab-home" href="../">← 项目工坊</a>
        <a class="site-home" href="https://www.lyf233.cn/">主页</a>
    </nav>
    <div id="ui-panel">
        <h3>电磁场参数控制</h3>
        <div class="engine-status"><span></span> PHYSICS ENGINE ACTIVE</div>
        <div class="control-group">
            <label for="preset-select">实验预设</label>
            <select id="preset-select"><option value="">自定义参数</option></select>
        </div>
        <div class="control-group">
            <label>磁场 B (Y轴向): <span id="b-val">-5.0</span> T</label>
            <input type="range" id="b-slider" min="-5" max="5" step="0.1" value="-5">
        </div>
        <div class="control-group">
            <label>电场 E (Y轴向): <span id="e-val">0.1</span> V/m</label>
            <input type="range" id="e-slider" min="-2" max="2" step="0.1" value="0.1">
        </div>
        <div class="button-row"><button id="reset-btn">重置粒子</button><button id="save-run-btn" class="secondary">保存记录</button></div>
        <div id="sync-state" role="status">正在连接实验数据服务</div>
    </div>

    <details id="run-panel" open>
        <summary>最近实验记录</summary>
        <div id="run-list"><p class="empty-run">暂无实验记录</p></div>
    </details>

    <div id="chart-panel"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
