<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="直流电机电枢回路与机械响应浏览器实验。">
  <title>直流电机阶跃响应 | LYF Lab</title>
  <script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root{color-scheme:light;--bg:#e9eef1;--surface:#fff;--ink:#172126;--muted:#65737a;--line:#ccd6db;--accent:#00737a;--signal:#d97706;--dark:#11191d}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:var(--ink);background:var(--bg);font-family:Inter,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}
    .topbar{height:62px;display:flex;align-items:center;gap:16px;padding:0 max(18px,calc((100vw - 1320px)/2));border-bottom:1px solid var(--line);background:#fff}.topbar a{color:var(--accent);text-decoration:none;font-weight:700}.topbar span{color:var(--muted);font-size:.78rem}.topbar strong{margin-left:auto;font:700 .72rem Consolas,monospace}
    main{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;gap:12px;width:min(1360px,calc(100% - 24px));margin:12px auto}.panel{min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.controls,.history{padding:18px}.controls h1{margin:0 0 5px;font-size:1.15rem}.intro{margin:0 0 20px;color:var(--muted);font-size:.78rem;line-height:1.55}.field{margin-bottom:16px}.field-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:.76rem}.field output{color:var(--accent);font:700 .75rem Consolas,monospace}input[type=range]{width:100%;accent-color:var(--accent)}select{width:100%;height:38px;padding:0 9px;border:1px solid var(--line);border-radius:4px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.button{height:40px;border:1px solid var(--accent);border-radius:4px;color:#fff;background:var(--accent);font-weight:700;cursor:pointer}.button.secondary{color:var(--accent);background:#fff}.button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
    .workspace{display:grid;grid-template-rows:minmax(420px,1fr) auto;gap:12px}.chart-panel{height:calc(100vh - 202px);min-height:440px}.chart{width:100%;height:100%}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}.metric{padding:14px;background:#fff}.metric span{display:block;color:var(--muted);font-size:.67rem}.metric strong{display:block;margin-top:8px;font:700 1.1rem Consolas,monospace}.history h2{margin:0;font-size:.88rem}.sync-state{margin:5px 0 14px;color:var(--muted);font-size:.68rem}.run-list{display:grid;gap:8px;max-height:calc(100vh - 175px);overflow:auto}.run{padding:10px;border:1px solid var(--line);background:#f7f9fa;cursor:pointer}.run:hover{border-color:var(--accent)}.run strong{display:block;font-size:.75rem}.run p{margin:5px 0;color:var(--muted);font:.68rem/1.5 Consolas,monospace}.run time{color:#88969b;font-size:.62rem}.empty{padding:24px 4px;color:var(--muted);font-size:.75rem;text-align:center}
    @media(max-width:1050px){main{grid-template-columns:280px 1fr}.history{grid-column:1/-1}.run-list{grid-template-columns:repeat(3,1fr);max-height:none}}@media(max-width:720px){.topbar{height:auto;min-height:62px;flex-wrap:wrap;padding:12px 16px}.topbar strong{width:100%;margin:0}main{display:block;width:calc(100% - 16px);margin:8px}.panel{margin-bottom:8px}.chart-panel{height:400px;min-height:0}.metrics{grid-template-columns:1fr 1fr}.run-list{display:grid;grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><a href="../">← 项目工坊</a><a href="https://www.lyf233.cn/">主页</a><span>DC MOTOR / STEP RESPONSE</span><strong id="backend-state">BACKEND CONNECTING</strong></header>
  <main>
    <aside class="panel controls">
      <h1>直流电机参数</h1><p class="intro">采用电枢电路与机械运动方程，使用 RK4 计算 10 秒阶跃响应。</p>
      <div class="field"><label class="field-head" for="preset"><span>实验预设</span></label><select id="preset"><option value="">自定义参数</option></select></div>
      <div class="field"><label class="field-head" for="voltage"><span>电枢电压</span><output id="voltage-out">220 V</output></label><input id="voltage" type="range" min="24" max="260" step="1" value="220"></div>
      <div class="field"><label class="field-head" for="load"><span>负载转矩</span><output id="load-out">8.0 N·m</output></label><input id="load" type="range" min="0" max="20" step="0.5" value="8"></div>
      <div class="field"><label class="field-head" for="inertia"><span>转动惯量 J</span><output id="inertia-out">0.12 kg·m²</output></label><input id="inertia" type="range" min="0.03" max="0.3" step="0.01" value="0.12"></div>
      <div class="field"><label class="field-head" for="resistance"><span>电枢电阻 R</span><output id="resistance-out">1.8 Ω</output></label><input id="resistance" type="range" min="0.5" max="5" step="0.1" value="1.8"></div>
      <div class="actions"><button class="button" id="run" type="button">运行仿真</button><button class="button secondary" id="save" type="button">保存记录</button></div>
    </aside>
    <section class="workspace">
      <div class="panel chart-panel"><div id="response-chart" class="chart" aria-label="电机转速与电流响应曲线"></div></div>
      <div class="panel metrics"><div class="metric"><span>稳态转速</span><strong id="steady-speed">-- rpm</strong></div><div class="metric"><span>峰值电流</span><strong id="peak-current">-- A</strong></div><div class="metric"><span>90% 上升时间</span><strong id="rise-time">-- s</strong></div><div class="metric"><span>机械输出功率</span><strong id="mechanical-power">-- W</strong></div></div>
    </section>
    <aside class="panel history"><h2>最近实验</h2><p class="sync-state" id="sync-state">记录保存在后端，可再次载入参数</p><div class="run-list" id="run-list"><div class="empty">暂无实验记录</div></div></aside>
  </main>
  <script>
    const API_ROOT=['localhost','127.0.0.1'].includes(location.hostname)?'http://127.0.0.1:8090/api/v1':'/api/v1';
    const CLIENT_KEY='lyf_lab_client_id';
    function clientId(){let value=localStorage.getItem(CLIENT_KEY);if(!/^[0-9a-f-]{36}$/i.test(value||'')){value=crypto.randomUUID();localStorage.setItem(CLIENT_KEY,value)}return value}
    const ids=['voltage','load','inertia','resistance']; const chart=echarts.init(document.getElementById('response-chart')); let currentResult=null;
    const api=async(path,options={})=>{const response=await fetch(API_ROOT+path,{credentials:'include',...options,headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(9000)});if(!response.ok)throw new Error(`${response.status}`);return response.status===204?null:response.json()};
    const voltageInput=document.getElementById('voltage'),loadInput=document.getElementById('load'),inertiaInput=document.getElementById('inertia'),resistanceInput=document.getElementById('resistance');
    function params(){return{voltage:+voltageInput.value,load_torque:+loadInput.value,inertia:+inertiaInput.value,resistance:+resistanceInput.value,inductance:.12}}
    function syncOutputs(){voltageOut.textContent=`${voltageInput.value} V`;loadOut.textContent=`${(+loadInput.value).toFixed(1)} N·m`;inertiaOut.textContent=`${(+inertiaInput.value).toFixed(2)} kg·m²`;resistanceOut.textContent=`${(+resistanceInput.value).toFixed(1)} Ω`}
    const voltageOut=document.getElementById('voltage-out'),loadOut=document.getElementById('load-out'),inertiaOut=document.getElementById('inertia-out'),resistanceOut=document.getElementById('resistance-out');
    function derivatives(i,w,p){const ke=.12,kt=.12,damping=.004;return[(p.voltage-p.resistance*i-ke*w)/p.inductance,(kt*i-damping*w-p.load_torque)/p.inertia]}
    function simulate(p){let i=0,w=0;const dt=.01,times=[],rpm=[],amps=[];for(let step=0;step<=1000;step++){const t=step*dt;if(step%5===0){times.push(t.toFixed(2));rpm.push(w*60/(2*Math.PI));amps.push(i)}const k1=derivatives(i,w,p),k2=derivatives(i+k1[0]*dt/2,w+k1[1]*dt/2,p),k3=derivatives(i+k2[0]*dt/2,w+k2[1]*dt/2,p),k4=derivatives(i+k3[0]*dt,w+k3[1]*dt,p);i+=dt*(k1[0]+2*k2[0]+2*k3[0]+k4[0])/6;w+=dt*(k1[1]+2*k2[1]+2*k3[1]+k4[1])/6}const steady=rpm.at(-1),threshold=steady*.9,index=rpm.findIndex(v=>v>=threshold),peak=Math.max(...amps),power=Math.max(0,p.load_torque*w);return{times,rpm,amps,metrics:{steady_speed:+steady.toFixed(2),peak_current:+peak.toFixed(2),rise_time:index>=0?+times[index]:10,mechanical_power:+power.toFixed(2)}}}
    function render(result){currentResult=result;chart.setOption({animationDuration:350,tooltip:{trigger:'axis'},legend:{data:['转速 rpm','电枢电流 A'],top:18},grid:{left:58,right:58,top:62,bottom:42},xAxis:{type:'category',name:'t / s',data:result.times},yAxis:[{type:'value',name:'rpm'},{type:'value',name:'A'}],series:[{name:'转速 rpm',type:'line',showSymbol:false,smooth:.2,data:result.rpm,lineStyle:{color:'#00737a',width:2}},{name:'电枢电流 A',type:'line',yAxisIndex:1,showSymbol:false,smooth:.2,data:result.amps,lineStyle:{color:'#d97706',width:2}}]});const m=result.metrics;document.getElementById('steady-speed').textContent=`${m.steady_speed} rpm`;document.getElementById('peak-current').textContent=`${m.peak_current} A`;document.getElementById('rise-time').textContent=`${m.rise_time} s`;document.getElementById('mechanical-power').textContent=`${m.mechanical_power} W`}
    function run(){render(simulate(params()))}
    function applyParameters(p){voltageInput.value=p.voltage;loadInput.value=p.load_torque;inertiaInput.value=p.inertia;resistanceInput.value=p.resistance;syncOutputs();run()}
    async function loadPresets(){try{const data=await api(`/lab/presets?client_id=${clientId()}&experiment=dc-motor-response`);const select=document.getElementById('preset');data.items.forEach(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name;option.dataset.parameters=JSON.stringify(item.parameters);select.appendChild(option)});select.onchange=()=>{const option=select.selectedOptions[0];if(option.dataset.parameters)applyParameters(JSON.parse(option.dataset.parameters))};document.getElementById('backend-state').textContent='BACKEND ONLINE'}catch{document.getElementById('backend-state').textContent='LOCAL MODE'}}
    async function loadRuns(){try{const data=await api(`/lab/runs?client_id=${clientId()}&experiment=dc-motor-response`);const list=document.getElementById('run-list');if(!data.items.length){list.innerHTML='<div class="empty">暂无实验记录</div>';return}list.innerHTML=data.items.map(item=>`<article class="run" data-params='${JSON.stringify(item.parameters)}'><strong>${item.parameters.voltage} V / ${item.parameters.load_torque} N·m</strong><p>${item.results.steady_speed} rpm · ${item.results.peak_current} A</p><time>${new Date(item.created_at).toLocaleString('zh-CN',{hour12:false})}</time></article>`).join('');list.querySelectorAll('.run').forEach(item=>item.onclick=()=>applyParameters(JSON.parse(item.dataset.params)))}catch{document.getElementById('sync-state').textContent='后端暂不可用，仿真仍可在本地运行'}}
    ids.forEach(id=>document.getElementById(id).addEventListener('input',syncOutputs));document.getElementById('run').onclick=run;document.getElementById('save').onclick=async()=>{if(!currentResult)run();const button=document.getElementById('save');button.disabled=true;try{await api('/lab/runs',{method:'POST',body:JSON.stringify({client_id:clientId(),experiment:'dc-motor-response',parameters:params(),results:currentResult.metrics,notes:''})});document.getElementById('sync-state').textContent='实验记录已保存';await loadRuns()}catch{document.getElementById('sync-state').textContent='保存失败，请检查后端连接'}finally{button.disabled=false}};addEventListener('resize',()=>chart.resize());syncOutputs();run();loadPresets();loadRuns();
  </script>
</body>
</html>
